version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - PORT=8080
      - NODE_ENV=development
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/gignet}
      - FORECAST_SERVICE_URL=http://forecast:8080
    depends_on:
      - mongo
      - forecast

  forecast:
    build:
      context: ./forecast-service
      dockerfile: Dockerfile
    ports:
      - "8000:8080"

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
